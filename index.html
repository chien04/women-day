<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gửi em iu 20/10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Lora:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #4a1d2b;
            --soft: #8a4b5d;
            --rose: #d6336c;
            --paper: #ffffff;
            --shadow: rgba(120, 30, 60, .22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
        }

        html {
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: linear-gradient(180deg, #fff6f8 0%, #ffe2ea 100%);
            color: var(--ink);
            font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
            overflow: hidden;
            overscroll-behavior: none;
        }

        .stage {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            overflow: hidden;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* Khung cây (canvas) */
        .tree-wrap {
            position: relative;
            flex: none;
            width: min(440px, 92vw, calc((100dvh - 32px) * 440 / 680));
            max-height: calc(100dvh - 32px);
        }

        #cv {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 440 / 680;
            touch-action: manipulation;
            cursor: default;
        }

        #cv.hand {
            cursor: pointer;
        }

        .hint {
            position: absolute;
            left: 55.7%;
            top: 53%;
            transform: translateX(-50%);
            font-family: Lora, Georgia, serif;
            font-style: italic;
            color: var(--rose);
            font-size: 1rem;
            pointer-events: none;
            transition: opacity .4s ease;
            animation: blink 1.8s ease-in-out infinite;
        }

        .hint.hide {
            opacity: 0;
            animation: none;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: .45;
            }

            50% {
                opacity: 1;
            }
        }

        /* Khung lời chúc + 3 ảnh: mở ra sau khi cây nở hoa, đẩy cây sang trái */
        .panel {
            flex: none;
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: width 1.4s ease, opacity 1s ease .5s;
        }

        .panel.show {
            width: min(480px, 46vw);
            opacity: 1;
        }

        .panel-inner {
            width: 460px;
            max-width: 100%;
            padding: 0 8px 0 18px;
            text-align: center;
        }

        h1 {
            font-family: Lora, Georgia, "Times New Roman", serif;
            font-style: italic;
            font-weight: 500;
            font-size: clamp(2rem, 4.5vw, 2.8rem);
            line-height: 1.2;
            color: var(--rose);
            margin-bottom: 14px;
        }

        .wishes {
            color: var(--soft);
            font-size: 1rem;
        }

        .wishes p+p {
            margin-top: 8px;
        }

        .photos {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0 26px;
        }

        .photo {
            flex: 1 1 0;
            max-width: 140px;
            padding: 6px 6px 8px;
            background: var(--paper);
            border-radius: 3px;
            box-shadow: 0 10px 22px var(--shadow);
            transition: transform .3s ease;
        }

        .photo:nth-child(1) {
            transform: rotate(-4deg);
        }

        .photo:nth-child(2) {
            transform: rotate(2deg) translateY(-8px);
        }

        .photo:nth-child(3) {
            transform: rotate(-2deg);
        }

        .photo:hover {
            transform: rotate(0) scale(1.06);
        }

        .photo img {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background: #f3d3da;
        }

        .sign {
            font-family: Lora, Georgia, serif;
            font-style: italic;
            font-size: 1.25rem;
            color: var(--rose);
        }

        /* Điện thoại: cây ở trên, nội dung ở dưới */
        @media (max-width: 860px) {

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .stage {
                height: 100dvh;
                min-height: 0;
                flex-direction: column;
                justify-content: center;
                gap: 8px;
                padding: 12px 12px;
                overflow: hidden;
            }

            .tree-wrap {
                width: min(440px, 92vw, calc((100dvh - 24px) * 440 / 680));
                flex: 0 1 auto;
                max-height: calc(100dvh - 24px);
            }

            #cv {
                max-height: calc(100dvh - 24px);
            }

            .panel {
                width: 100%;
                max-height: 0;
                overflow: hidden;
                transition: max-height 1.4s ease, opacity 1s ease .5s;
            }

            .panel.show {
                width: 100%;
                max-height: min(48dvh, 520px);
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
            }

            .panel-inner {
                margin: 0 auto;
                padding: 8px 14px 36px;
            }

            .photo {
                max-width: 120px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hint {
                animation: none;
            }

            .panel,
            .photo {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="stage">
        <div class="tree-wrap">
            <canvas id="cv" aria-label="Cây tình yêu: chạm nhẹ vào trái tim anh để bắt đầu"></canvas>
            <div class="hint" id="hint">Chạm nhẹ thuiii em nhó…</div>
        </div>

        <div class="panel" id="panel">
            <div class="panel-inner">
                <h1>Xin chào em iu!</h1>
                <div class="wishes">
                    <p>Chúc em iu ngày Phụ nữ Việt Nam luôn luôn xinh đẹp, mạnh khoẻ, vững bước trên con đường sắp tới.
                    </p>
                    <p>Dù còn nhiều khó khăn, thử thách, nhưng anh tin em sẽ vượt qua tất cả. Cả hai đứa cùng cố gắng
                        nha emmm:3</p>
                </div>

                <!-- 3 ảnh: đặt vào thư mục image/ với tên anh1.jpg, anh2.jpg, anh3.jpg -->
                <div class="photos">
                    <figure class="photo"><img src="image/anh1.jpg" alt="Ảnh 1"></figure>
                    <figure class="photo"><img src="image/anh2.jpg" alt="Ảnh 2"></figure>
                    <figure class="photo"><img src="image/anh3.jpg" alt="Ảnh 3"></figure>
                </div>

                <p class="sign">iu em :3</p>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ---------- Ảnh dự phòng khi chưa có file ảnh ----------
            var placeholder = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="300" height="400" fill="#f8d7df"/>' +
                '<text x="150" y="205" font-family="sans-serif" font-size="22" fill="#b0627a" text-anchor="middle">Thêm ảnh</text></svg>');
            document.querySelectorAll('.photo img').forEach(function (img) {
                img.addEventListener('error', function () { if (img.src !== placeholder) img.src = placeholder; });
            });

            // ---------- Canvas ----------
            var W = 440, H = 680, OX = 290;            // vùng vẽ: x từ 290 đến 730 của hệ toạ độ gốc 1100x680
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var cv = document.getElementById('cv');
            var ctx = cv.getContext('2d');
            cv.width = W * dpr; cv.height = H * dpr;
            var tl = document.createElement('canvas');   // lớp lưu thân cây + hoa đã vẽ
            tl.width = cv.width; tl.height = cv.height;
            var tc = tl.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, -OX * dpr, 0);
            tc.setTransform(dpr, 0, 0, dpr, -OX * dpr, 0);

            function parse(a) {
                return { p: a.slice(0, 6), r: a[6], len: a[7], kids: (a[8] || []).map(parse) };
            }
            // Dữ liệu cành cây: [x0,y0, cx,cy, x1,y1, độ dày, số bước, [cành con]]
            var TREE = [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]]
            ].map(parse);

            var COLORS = ['#ff8fab', '#ff5d8f', '#f72585', '#ffb3c6', '#e63970', '#ffccd5'];
            var BARK = '#4a2c2c';

            function heart(c, x, y, s, rot) {
                c.save();
                c.translate(x, y);
                if (rot) c.rotate(rot);
                c.beginPath();
                c.moveTo(0, s);
                c.bezierCurveTo(-s * 1.6, -s * 0.2, -s * 0.8, -s * 1.2, 0, -s * 0.4);
                c.bezierCurveTo(s * 0.8, -s * 1.2, s * 1.6, -s * 0.2, 0, s);
                c.closePath();
                c.fill();
                c.restore();
            }
            function pt(p, t) {
                var u = 1 - t;
                return [u * u * p[0] + 2 * u * t * p[2] + t * t * p[4],
                u * u * p[1] + 2 * u * t * p[3] + t * t * p[5]];
            }

            // Điểm nở hoa: nằm trong hình trái tim lớn làm tán cây
            var blooms = [];
            for (var i = 0; i < 700; i++) {
                var a = Math.random() * Math.PI * 2, k = Math.sqrt(Math.random());
                var hx = 16 * Math.pow(Math.sin(a), 3);
                var hy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
                blooms.push([535 + hx * k * 14, 250 - hy * k * 14]);
            }

            var hint = document.getElementById('hint');
            var panel = document.getElementById('panel');
            var phase = 'seed', frame = 0, fallT = 0, gt = 0, bi = 0, active = [], petals = [], lastPetal = 0;
            var SEED = { x: 535, y: 300, s: 18 };

            function clearMain() {
                ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, cv.width, cv.height);
                ctx.drawImage(tl, 0, 0);
                ctx.restore();
            }

            function startGrow() {
                phase = 'grow';
                active = TREE.map(function (b) { return { b: b, t: 0 }; });
            }

            function stepGrow() {
                var next = [];
                active.forEach(function (it) {
                    var b = it.b, step = 1 / (b.len * 0.6), t1 = Math.min(1, it.t + step), n = 3;
                    tc.strokeStyle = BARK; tc.lineCap = 'round';
                    for (var i = 0; i < n; i++) {
                        var ta = it.t + (t1 - it.t) * i / n, tb = it.t + (t1 - it.t) * (i + 1) / n;
                        var A = pt(b.p, ta), B = pt(b.p, tb);
                        tc.lineWidth = Math.max(1, b.r * 0.55 * (1 - 0.8 * tb));
                        tc.beginPath(); tc.moveTo(A[0], A[1]); tc.lineTo(B[0], B[1]); tc.stroke();
                    }
                    it.t = t1;
                    if (t1 < 1) next.push(it);
                    else b.kids.forEach(function (k) { next.push({ b: k, t: 0 }); });
                });
                active = next;
                if (!active.length) phase = 'bloom';
            }

            function drawGround() {
                tc.strokeStyle = BARK; tc.lineWidth = 3; tc.lineCap = 'round';
                tc.beginPath(); tc.moveTo(535 - 210 * gt, 678); tc.lineTo(535 + 210 * gt, 678); tc.stroke();
            }

            function loop() {
                frame++;
                clearMain();

                if (phase === 'seed') {
                    ctx.fillStyle = 'rgb(190,26,37)';
                    heart(ctx, SEED.x, SEED.y, SEED.s * (1 + 0.08 * Math.sin(frame / 8)), 0);
                } else if (phase === 'fall') {
                    fallT++;
                    var q = Math.min(1, fallT / 70);
                    ctx.fillStyle = 'rgb(190,26,37)';
                    heart(ctx, SEED.x, SEED.y + 372 * q * q, SEED.s - 12 * q, 0);
                    if (fallT >= 70) startGrow();
                } else if (phase === 'grow') {
                    gt = Math.min(1, gt + 0.04); drawGround();
                    stepGrow();
                } else if (phase === 'bloom') {
                    for (var i = 0; i < 3 && bi < blooms.length; i++, bi++) {
                        tc.fillStyle = COLORS[(Math.random() * COLORS.length) | 0];
                        heart(tc, blooms[bi][0], blooms[bi][1], 4 + Math.random() * 5, (Math.random() - 0.5) * 0.8);
                    }
                    if (bi >= blooms.length) {
                        phase = 'done';
                        panel.classList.add('show');
                        // Không tự cuộn trang khi hiện lời chúc; giữ cây và trái tim cố định.

                    }
                } else if (phase === 'done') {
                    // Cánh hoa tim rơi nhẹ
                    if (frame - lastPetal > 7 && petals.length < 70 &&
                        !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                        lastPetal = frame;
                        var s = blooms[(Math.random() * blooms.length) | 0];
                        petals.push({
                            x: s[0], y: s[1], vy: 0.5 + Math.random() * 0.7, ph: Math.random() * 6.28,
                            sw: 0.4 + Math.random() * 0.5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.08,
                            s: 3 + Math.random() * 3, c: COLORS[(Math.random() * COLORS.length) | 0], rest: 0
                        });
                    }
                    petals = petals.filter(function (p) {
                        if (p.y < 674) { p.y += p.vy; p.ph += 0.03; p.x += Math.sin(p.ph) * p.sw; p.rot += p.vr; }
                        else { p.rest++; }
                        ctx.globalAlpha = p.rest ? Math.max(0, 1 - p.rest / 200) : 1;
                        ctx.fillStyle = p.c;
                        heart(ctx, p.x, Math.min(p.y, 674), p.s, p.rot);
                        ctx.globalAlpha = 1;
                        return p.rest < 200;
                    });
                }
                requestAnimationFrame(loop);
            }

            function begin() {
                if (phase !== 'seed') return;
                phase = 'fall';
                hint.classList.add('hide');
                cv.classList.remove('hand');
            }
            cv.addEventListener('pointerdown', begin);
            cv.addEventListener('pointermove', function (e) {
                if (phase !== 'seed') return;
                var r = cv.getBoundingClientRect();
                var x = (e.clientX - r.left) * (W / r.width) + OX, y = (e.clientY - r.top) * (H / r.height);
                cv.classList.toggle('hand', Math.hypot(x - SEED.x, y - SEED.y) < 40);
            });

            loop();
        })();
    </script>
</body>

</html>
